<style>
/* Layout: sign-in card, then left rail on laptop and bottom tab bar on phone. Colors and fonts are tokens, so the whole look changes from this block. */
:root {
  --bg: #f2f5f6; --surface: #ffffff; --surface-2: #e8eef0; --line: #d3dde0;
  --glow1: #d3eef1; --glow2: #e6e3f8; --glow3: #fbeede;
  --fg: #11262b; --muted: #5a7078; --accent: #0b7a86; --accent-ink: #ffffff; --accent-soft: #d6eef0;
  --good: #1b8a4b; --good-soft: #d9f1e3; --warn: #a86a00; --warn-soft: #fbecc9; --bad: #c0352b; --bad-soft: #f9dcd9;
  --font-display: "Sora", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Noto Sans Bengali", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glow1: #123a41; --glow2: #1d2347; --glow3: #2b2418;
    --bg: #0c1a1e; --surface: #132a30; --surface-2: #1b363d; --line: #27444c; --fg: #e4f0f2; --muted: #8fabb2;
    --accent: #3cc3d1; --accent-ink: #052a30; --accent-soft: #14424a; --good: #52d08a; --good-soft: #14392a;
    --warn: #f0b650; --warn-soft: #3f2f10; --bad: #ff8a80; --bad-soft: #4a1f1c; color-scheme: dark;
  }
}
* { box-sizing: border-box; touch-action: manipulation; }
input, select { font-size: 16px; }
body { overscroll-behavior-y: contain; }
.ptr { position: fixed; top: 0; left: 50%; transform: translate(-50%, -60px); z-index: 50; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.12); pointer-events: none; transition: transform .15s; }
.ptr.show { transition: none; }
body { margin: 0; background: radial-gradient(900px 520px at 0% -8%, var(--glow1), transparent 62%), radial-gradient(780px 480px at 100% 4%, var(--glow2), transparent 60%), radial-gradient(900px 520px at 50% 108%, var(--glow3), transparent 60%), var(--bg); background-attachment: fixed; color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding: 16px 16px 88px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.app { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; }
.rail { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.brand svg { width: 28px; height: 28px; color: var(--accent); flex: none; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a svg { width: 20px; height: 20px; flex: none; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover { background: var(--bad-soft); }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.notice.err { background: var(--bad-soft); color: var(--bad); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 15px; margin: 0 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
:root[lang="bn"] .tile .k { letter-spacing: 0; text-transform: none; font-size: 13px; }
.isp-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.isp-b { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; min-height: 64px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 6px; cursor: pointer; }
.isp-b:active { background: var(--accent-soft); }
.isp-b img { width: 44px; height: 44px; border-radius: 10px; }
.isp-fb { font-size: 12px; text-align: center; line-height: 1.2; }
#nets, #wans, #wifi-body { display: flex; flex-direction: column; gap: 12px; }
.grp { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 2px 8px; font-size: 16px; }
.grp small { color: var(--muted); font-size: 13px; font-weight: 400; }
.grp-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.net-head { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.net-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
.net.ok .net-dot { background: var(--good); } .net.bad .net-dot { background: var(--bad); } .net.bad { border-color: var(--bad); }
.net .hint { color: var(--muted); font-size: 14px; margin: 6px 0 10px; }
.pill.rt { background: var(--accent-soft); color: var(--fg); }
.rt-select { width: 100%; min-height: 44px; margin: 6px 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 0 10px; font: inherit; }
#rbar { margin-bottom: 12px; }
.rt-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rt-row .grow { flex: 1; min-width: 160px; overflow-wrap: anywhere; }
.rt-row small { display: block; color: var(--muted); font-size: 12px; }
.acl h2 { margin-bottom: 4px; }
.acl .hint { color: var(--muted); font-size: 14px; margin: 6px 0 12px; }
.acl-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 48px; }
.acl-row input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
.acl-row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.acl-row small { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.acl-actions { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tile.tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tile.tap:active { background: var(--accent-soft); }
.tile .v { font-family: var(--font-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 4px; }
.tile .v small { font-size: 13px; color: var(--muted); margin-inline-start: 4px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 6px; }
.top-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.top-list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px; }
.top-list .bar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.top-list .bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: end; font-family: var(--font-mono); overflow-wrap: anywhere; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 40px; }
.chips { display: flex; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.devices { display: flex; flex-direction: column; gap: 10px; }
.dev { display: grid; grid-template-columns: 44px minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.dev.blocked { opacity: .85; }
.dev .ico { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.dev.blocked .ico { background: var(--bad-soft); color: var(--bad); }
.dev .ico svg { width: 24px; height: 24px; }
.dev .name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dev .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.dev .use { font-size: 13px; color: var(--muted); }
.dev .use b { color: var(--fg); font-family: var(--font-mono); font-weight: 500; }
.dev .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.dev .acts label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select, input[type="text"], input[type="password"] { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-height: 34px; max-width: 100%; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input { width: 100%; min-height: 42px; }
.act-list { list-style: none; margin: 0; padding: 0; }
.act-list li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.act-list li:first-child { border-top: 0; }
.act-list time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.login { min-height: calc(100vh - 120px); display: grid; place-items: center; }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.login-card h1 { font-size: 20px; }
.login-card p { margin: 0; color: var(--muted); font-size: 14px; }
.login-err { color: var(--bad); font-size: 14px; min-height: 22px; }
.login-top { display: flex; justify-content: flex-end; max-width: 380px; margin: 0 auto; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .rail .brand { display: none; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; flex-direction: row; background: var(--surface); border-top: 1px solid var(--line); z-index: 20; padding: 6px 8px; gap: 2px; }
  .nav a { flex: 1; flex-direction: column; gap: 2px; font-size: 12px; padding: 6px 4px; justify-content: center; text-align: center; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .dev { grid-template-columns: 44px minmax(0, 1fr); }
  .dev .use, .dev .acts { grid-column: 1 / -1; }
  .dev .acts { justify-content: flex-start; }
  h1 { font-size: 21px; }
}

      return '<label class="acl-row"><input type="checkbox" data-mac="' + d.mac + '"' + (on ? " checked" : "") + (forced ? " disabled" : "") + '><span>' + esc(d.name) + (me ? " · " + esc(t("acl_you")) : "") + '<small>' + d.mac + '</small></span></label>';
    }).join("");
  }
  function loadAcl() {
    if (!acl.rid) acl.rid = aclDefault();
    var rid = acl.rid;
    return api("/api/filter", { rid: rid }).then(function (f) {
      if (rid !== acl.rid) return;
      acl.saved = f; acl.me = f.me; acl.mode = f.mode; acl.sel = {}; f.list.forEach(function (m) { acl.sel[m.mac] = true; }); acl.loaded = true; renderAcl();
    }).catch(function (e) { $("#acl-msg").textContent = e.message; });
  }
  function reloadAcl() { acl.loaded = false; acl.saved = null; acl.busy = true; renderAcl(); return loadAcl().then(function () { acl.busy = false; renderAcl(); }); }
  document.addEventListener("visibilitychange", function () { document.documentElement.classList.toggle("bg", document.hidden); });
  document.querySelectorAll("[data-wt]").forEach(function (b) { b.addEventListener("click", function () { $("#view-wifi").dataset.tab = b.dataset.wt; document.querySelectorAll("[data-wt]").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); }); });
  $("#acl-rt").addEventListener("change", function () { acl.rid = this.value; reloadAcl(); });
  document.querySelectorAll("#acl-mode .chip").forEach(function (c) { c.addEventListener("click", function () { acl.mode = c.dataset.m; renderAcl(); }); });
  $("#acl-list").addEventListener("change", function (e) { var c = e.target.closest("[data-mac]"); if (c) acl.sel[c.dataset.mac] = c.checked; });
  $("#acl-save").addEventListener("click", function () {
    var b = this;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = t("acl_confirm"); setTimeout(function () { b.dataset.armed = ""; b.textContent = t("acl_save"); }, 3500); return; }
    b.dataset.armed = ""; b.textContent = t("acl_save");
    var macs = Object.keys(acl.sel).filter(function (m) { return acl.sel[m] && m !== acl.me; });
    acl.busy = true; renderAcl(); $("#acl-msg").textContent = "";
    api("/api/filter/set", { rid: acl.rid, mode: acl.mode, macs: macs }).then(function () { toast(t("acl_saved")); return loadAcl(); })
      .catch(function (er) { toast(er.message); $("#acl-msg").textContent = er.message; }).then(function () { acl.busy = false; renderAcl(); });
  });

  function findDev(key) { var p = key.split("|"); return state.devices.filter(function (x) { return x.rid === p[0] && x.mac === p[1]; })[0]; }
  $("#devices").addEventListener("click", function (e) {
    var b = e.target.closest("[data-block]"); if (!b) return;
    var key = b.dataset.block, d = findDev(key), want = !d.blocked;
    if (want && b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = t("confirm_block"); setTimeout(function () { if (b.isConnected) { b.dataset.armed = ""; b.textContent = t("block"); } }, 3500); return; }
    pending[key] = true; renderDevices();
    api("/api/block", { rid: d.rid, mac: d.mac, blocked: want }).then(function () { log(want ? "e_block" : "e_unblock", { n: d.name }); toast(t(want ? "x_blocked" : "x_unblocked", { n: d.name })); })
      .catch(function (er) { toast(er.message); }).then(function () { delete pending[key]; return poll(); });
  });
  $("#devices").addEventListener("change", function (e) {
    var s = e.target.closest("[data-limit]"); if (!s) return;
    var key = s.dataset.limit, d = findDev(key), m = +s.value;
    pending[key] = true; renderDevices();
    api("/api/limit", { rid: d.rid, mac: d.mac, kbps: m ? m * 125 : 0 }).then(function () { var l = m ? num(m) + " Mbps" : t("no_limit"); log("e_limit", { n: d.name, l: l }); toast(t("x_limit", { n: d.name, l: l })); })
      .catch(function (er) { toast(er.message); }).then(function () { delete pending[key]; return poll(); });
  });
  $("#rbar").addEventListener("click", function (e) {
    var c = e.target.closest("[data-r]"); if (!c) return;
    sel = c.dataset.r; if (sel !== "all" && acl.rid !== sel && aclRouters().some(function (r) { return r.id === sel; })) { acl.rid = sel; if (route === "wifi") reloadAcl(); else acl.loaded = false; }
    renderAll();
  });
  $("#search").addEventListener("input", function (e) { query = e.target.value; renderDevices(); });
  document.querySelectorAll(".tile.tap").forEach(function (t) {
    function go() { if (t.dataset.route) { location.hash = "#" + t.dataset.route; return; } document.querySelector('.chip[data-f="' + t.dataset.go + '"]').click(); location.hash = "#devices"; }
    t.addEventListener("click", go);
    t.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  document.querySelectorAll(".chip").forEach(function (c) { c.addEventListener("click", function () { filter = c.dataset.f; document.querySelectorAll(".chip").forEach(function (x) { x.setAttribute("aria-pressed", x === c ? "true" : "false"); }); renderDevices(); }); });

  $("#login-form").addEventListener("submit", function (e) {
    e.preventDefault(); $("#login-err").textContent = "";
    api("/api/login", { password: $("#l-pass").value }).then(function (u) { user = u; $("#l-pass").value = ""; start(); })
      .catch(function (er) { $("#login-err").textContent = er.status === 401 ? t("login_bad") : er.message; });
  });
  function setLang(l) { lang = l; try { localStorage.setItem("wifi-lang", lang); } catch (e) {} applyStatic(); renderAcl(); renderAll(); markLang(); }
  function markLang() { document.querySelectorAll("[data-lang-set]").forEach(function (c) { c.setAttribute("aria-pressed", c.dataset.langSet === lang ? "true" : "false"); }); }
  document.querySelectorAll("[data-lang-set]").forEach(function (c) { c.addEventListener("click", function () { setLang(c.dataset.langSet); }); });
  markLang();
  function openRouter(id) {
    var r = R[id] || R[curId()], u = (r && r.url) || (routers()[0] && routers()[0].url) || "http://192.168.1.1", ok = false;
    try { ok = Native.openUrl(u); } catch (e) {}
    if (!ok) { try { window.open(u, "_blank"); } catch (e) {} }
  }
  $("#open-router").addEventListener("click", function () { openRouter(); });
  $("#router-list").addEventListener("click", function (e) {
    var o = e.target.closest("[data-ropen]"); if (o) { openRouter(o.dataset.ropen); return; }
    var d = e.target.closest("[data-rdel]"); if (!d) return;
    if (routers().length <= 1) { toast(t("r_last")); return; }
    if (d.dataset.armed !== "1") { d.dataset.armed = "1"; d.textContent = t("r_confirm"); setTimeout(function () { if (d.isConnected) { d.dataset.armed = ""; d.textContent = t("r_remove"); } }, 3500); return; }
    cfg.routers = cfg.routers.filter(function (r) { return r.id !== d.dataset.rdel; }); saveCfg(); delete R[d.dataset.rdel];
    if (acl.rid === d.dataset.rdel) { acl.rid = ""; acl.loaded = false; }
    buildClients(); poll();
  });
  $("#add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("#add-err"), name = $("#a-name").value.trim() || ("Router " + (routers().length + 1)), url = $("#a-url").value.trim().replace(/\/+$/, ""), pw = $("#a-pw").value;
    err.textContent = ""; if (!/^https?:\/\//i.test(url)) url = "http://" + url;
    if (routers().some(function (r) { return r.url.toLowerCase() === url.toLowerCase(); })) { err.textContent = t("r_dup"); return; }
    $("#add-btn").disabled = true; err.textContent = t("s_checking");
    var type = $("#a-type").value, test = new RouterClient({ url: url, password: pw, native: nativeApi, type: type });
    test.snapshot().then(function () {
      cfg.routers.push({ id: "r" + Date.now().toString(36), name: name, url: url, rpw: pw, type: type }); if (!saveCfg()) throw new Error("Could not securely save the router password."); buildClients();
      $("#a-name").value = ""; $("#a-pw").value = ""; err.textContent = ""; toast(t("r_added")); acl.loaded = false; poll();
    }).catch(function (er) { err.textContent = er.message; }).then(function () { $("#add-btn").disabled = false; });
  });
  // ---- pull down at the top of any page to refresh ----
  (function () {
    var el = $("#ptr"), y0 = null, dy = 0, busy = false, LIM = 80;
    function top() { return (window.pageYOffset || document.documentElement.scrollTop || 0) <= 0; }
    function place(v, txt) { el.textContent = txt; el.className = "ptr show"; el.style.transform = "translate(-50%, " + (v - 60) + "px)"; }
    function hide() { el.className = "ptr"; el.style.transform = ""; }
    function refresh() {
      busy = true; place(24, t("ptr_loading"));
      var jobs = [poll()]; if (route === "wifi" && !acl.busy) jobs.push(reloadAcl());
      Promise.all(jobs.map(function (p) { return Promise.resolve(p).catch(function () {}); })).then(function () { busy = false; hide(); });
    }
    document.addEventListener("touchstart", function (e) {
      if (busy || !unlocked || $("#app").hidden || e.touches.length !== 1 || !top() || e.target.closest("select,input,textarea")) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0;
    }, { passive: true });
    document.addEventListener("touchmove", function (e) {
      if (y0 === null || busy) return;
      dy = e.touches[0].clientY - y0;
      if (dy <= 0 || !top()) { if (dy <= 0) hide(); return; }
      place(Math.min(dy / 2, 60), t(dy / 2 >= LIM / 2 ? "ptr_release" : "ptr_pull"));
    }, { passive: true });
    document.addEventListener("touchend", function () {
      if (y0 === null || busy) return;
      var go = dy / 2 >= LIM / 2; y0 = null; dy = 0;
      if (go) refresh(); else hide();
    }, { passive: true });
    document.addEventListener("touchcancel", function () { y0 = null; hide(); }, { passive: true });
  })();
  // ---- ISP contact buttons ----
  var ISP_NUM = "+8801407063150", ISP_DIGITS = "8801407063150", BKASH_PKG = "com.bKash.customerapp";
  $("#isp-num").textContent = ISP_NUM;
  var IMO_PKG = "com.imo.android.imoim";
  // The logos come from the apps installed on this phone (not drawn by us). If an app is missing, its name is shown instead.
  function loadIcon(btn, pkgs) {
    for (var i = 0; i < pkgs.length; i++) {
      var b64 = ""; try { b64 = Native.appIcon(pkgs[i]) || ""; } catch (e) {}
      if (b64) { btn.innerHTML = '<img alt="" src="data:image/png;base64,' + b64 + '">'; return; }
    }
  }
  function loadIcons() { loadIcon($("#isp-wa"), ["com.whatsapp", "com.whatsapp.w4b"]); loadIcon($("#isp-bkash"), [BKASH_PKG]); loadIcon($("#isp-imo"), [IMO_PKG, "com.imo.android.imoimbeta"]); }
  loadIcons();
  function openLink(u) { var ok = false; try { ok = Native.openUrl(u); } catch (e) {} if (!ok) { try { window.open(u, "_blank"); ok = true; } catch (e) {} } return ok; }
  $("#isp-wa").addEventListener("click", function () { if (!openLink("https://wa.me/" + ISP_DIGITS)) toast(t("isp_nowa")); });
  $("#isp-call").addEventListener("click", function () { openLink("tel:" + ISP_NUM); });
  $("#isp-imo").addEventListener("click", function () {
    var copied = false; try { copied = Native.copyText(ISP_NUM); } catch (e) {}
    if (!copied) { try { navigator.clipboard.writeText(ISP_NUM); } catch (e) {} }
    var opened = false; try { opened = Native.openApp(IMO_PKG) || Native.openApp("com.imo.android.imoimbeta"); } catch (e) {}
    if (opened) toast(t("isp_imo_copied")); else { toast(t("isp_noimo")); openLink("https://play.google.com/store/apps/details?id=" + IMO_PKG); }
  });
  $("#isp-bkash").addEventListener("click", function () {
    var copied = false; try { copied = Native.copyText(ISP_NUM); } catch (e) {}
    if (!copied) { try { navigator.clipboard.writeText(ISP_NUM); copied = true; } catch (e) {} }
    var opened = false; try { opened = Native.openApp(BKASH_PKG); } catch (e) {}
    if (opened) toast(t("isp_copied")); else { toast(t("isp_nobkash")); openLink("https://play.google.com/store/apps/details?id=" + BKASH_PKG); }
  });
  $("#logout").addEventListener("click", function () { api("/api/logout", {}).catch(function () {}).then(signedOut); });

  applyStatic();
  function showFirstScreen() { cfg = loadCfg(); $("#setup").hidden = !!cfg; $("#login").hidden = !cfg; $("#app").hidden = true; }
  $("#setup-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("#setup-err"), rname = $("#s-name").value.trim() || "Router 1", url = $("#s-url").value.trim().replace(/\/+$/, ""), rpw = $("#s-rpw").value, rtype = $("#s-type").value, a1 = $("#s-apw").value, a2 = $("#s-apw2").value;
    err.textContent = "";
    if (!/^https?:\/\//i.test(url)) url = "http://" + url;
    if (a1.length < 6) { err.textContent = t("s_short"); return; }
    if (a1 !== a2) { err.textContent = t("s_match"); return; }
    $("#setup-btn").disabled = true; err.textContent = t("s_checking");
    var test = new RouterClient({ url: url, password: rpw, native: nativeApi, type: rtype });
    test.login().then(function (ok) {
      if (!ok) throw new Error(t("s_rbad"));
      var salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
      if (!Native.securePut("router:r1", rpw)) throw new Error("Could not securely store the router password on this device.");
      localStorage.setItem("wifi-cfg", JSON.stringify({ routers: [{ id: "r1", name: rname, url: url, type: rtype }], salt: salt, hash: Native.sha256(salt + a1) }));
      cfg = loadCfg(); unlocked = true; user = USER;
      $("#setup").hidden = true; $("#s-rpw").value = $("#s-apw").value = $("#s-apw2").value = ""; err.textContent = "";
      start();
    }).catch(function (er) { err.textContent = er.message; }).then(function () { $("#setup-btn").disabled = false; });
  });
  $("#reset-app").addEventListener("click", function () {
    var b = this;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = t("app_settings_confirm"); setTimeout(function () { b.dataset.armed = ""; b.textContent = t("app_settings_btn"); }, 3500); return; }
    try { var oldCfg = loadCfg(); if (oldCfg && oldCfg.routers) oldCfg.routers.forEach(function(r){ Native.secureRemove("router:" + r.id); }); Native.secureRemove("ai:token"); localStorage.removeItem("wifi-cfg"); localStorage.removeItem("routemate-ai"); } catch (e) {}
    unlocked = false; R = {}; clearInterval(timer); showFirstScreen();
  });
  showFirstScreen();
})();
</script>
</body>
</html>
